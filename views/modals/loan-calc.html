    <div class="modal-overlay" id="loan-calc-modal">
        <div class="modal-content" style="max-width: 680px;">
            <h3>🏦 Іпотечний та Кредитний Калькулятор</h3>
            
            <div class="loan-calc-grid">
                <div class="loan-inputs-box">
                    <div class="deal-input-row">
                        <label>Сума кредиту (₴):</label>
                        <input type="number" id="loan-amount" value="500000" oninput="calculateLoanAmortization()">
                    </div>
                    <div class="deal-input-row">
                        <label>Річна ставка (%):</label>
                        <input type="number" id="loan-rate" value="14.5" step="0.1" oninput="calculateLoanAmortization()">
                    </div>
                    <div class="deal-input-row">
                        <label>Термін (місяців):</label>
                        <input type="number" id="loan-term" value="36" oninput="calculateLoanAmortization()">
                    </div>
                    <div class="deal-input-row">
                        <label>Тип схеми виплат:</label>
                        <select id="loan-type" onchange="calculateLoanAmortization()">
                            <option value="annuity">Ануїтетний (Рівні платежі)</option>
                            <option value="diff">Диференційований (Зменшуваний)</option>
                        </select>
                    </div>
                </div>

                <div class="loan-summary-cards">
                    <div class="loan-summary-card highlight">
                        <small>Щомісячний платіж:</small>
                        <strong id="loan-monthly-val">17 205.12 ₴</strong>
                    </div>
                    <div class="loan-summary-card">
                        <small>Переплата (Відсотки):</small>
                        <strong id="loan-interest-val">119 384.32 ₴</strong>
                    </div>
                    <div class="loan-summary-card">
                        <small>Загальна вартість:</small>
                        <strong id="loan-total-val">619 384.32 ₴</strong>
                    </div>
                    <div class="loan-summary-card">
                        <small>Коефіцієнт здорожчання:</small>
                        <strong id="loan-pct-val">+23.88%</strong>
                    </div>
                </div>
            </div>

            <!-- Графік погашення -->
            <div class="loan-table-wrapper">
                <table class="loan-amort-table">
                    <thead>
                        <tr>
                            <th style="text-align:center;">№</th>
                            <th>Платіж (₴)</th>
                            <th>Тіло (₴)</th>
                            <th>Відсотки (₴)</th>
                            <th>Залишок (₴)</th>
                        </tr>
                    </thead>
                    <tbody id="loan-table-tbody">
                        <!-- Динамічні рядки графіку -->
                    </tbody>
                </table>
            </div>

            <div class="converter-quick-actions" style="margin-top:12px;">
                <button class="btn-secondary" onclick="insertLoanMonthlyToCalc()">📥 Вставити щомісячний платіж</button>
                <button class="btn-secondary" onclick="insertLoanTotalToCalc()">📥 Вставити загальну суму</button>
            </div>

            <button class="close-btn" onclick="closeModal('loan-calc-modal')">Закрити</button>
        </div>
    </div>
