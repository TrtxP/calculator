    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content settings-modal-content">
            <h3>⚙️ Центр Налаштувань Калькулятора</h3>
            
            <div class="settings-sections">
                <div class="settings-group">
                    <h4>🔊 Звук та Тактильний Відгук</h4>
                    <div class="settings-row">
                        <label for="setting-volume">Гучність аудіо: <span id="setting-vol-val">80%</span></label>
                        <input type="range" id="setting-volume" min="0" max="100" value="80" oninput="updateSettingsVolume(this.value)">
                    </div>
                    <div class="settings-row">
                        <label>Профіль синтезу звуку:</label>
                        <select id="setting-sound-profile" onchange="setSettingsSoundProfile(this.value)">
                            <option value="classic">Класичний Poly Sine</option>
                            <option value="tactile">Тактильний механічний</option>
                            <option value="retro">8-бітний аркадний</option>
                            <option value="scifi">Футуристичний кристал</option>
                            <option value="off">Вимкнено (Без звуку)</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h4>🔢 Форматування Чисел та Округлення</h4>
                    <div class="settings-row">
                        <label>Розділювач тисяч (розрядів):</label>
                        <select id="setting-separator" onchange="setSettingsSeparator(this.value)">
                            <option value="space">Пробіл (1 000 000.00 - Стандарт UA/EU)</option>
                            <option value="comma">Кома (1,000,000.00 - Стандарт US)</option>
                            <option value="none">Без розділювача (1000000.00)</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>Точність округлення:</label>
                        <select id="setting-precision" onchange="setSettingsPrecision(this.value)">
                            <option value="auto">Автоматична (до 12 знаків)</option>
                            <option value="0">0 знаків (Цілі числа)</option>
                            <option value="2">2 знаки (0.01)</option>
                            <option value="4">4 знаки (0.0001)</option>
                            <option value="6">6 знаків (0.000001)</option>
                            <option value="8">8 знаків</option>
                            <option value="10">10 знаків</option>
                            <option value="12">12 знаків (Висока точність)</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>Кутовий режим за замовчуванням:</label>
                        <select id="setting-angle" onchange="setSettingsDefaultAngle(this.value)">
                            <option value="DEG">Градуси (DEG)</option>
                            <option value="RAD">Радіани (RAD)</option>
                            <option value="GRAD">Градіани / Гради (GRAD)</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h4>🔠 Типографіка & Масштаб Шрифтів</h4>
                    <div class="settings-row">
                        <label>Масштаб шрифту (Font Size):</label>
                        <select id="setting-font-scale" onchange="setFontScale(this.value)">
                            <option value="90">90% (Компактний)</option>
                            <option value="100" selected>100% (Стандартний)</option>
                            <option value="110">110% (Злегка збільшений)</option>
                            <option value="115">115% (Збільшений Pro)</option>
                            <option value="125">125% (Великий)</option>
                            <option value="130">130% (Дуже великий)</option>
                            <option value="145">145% (Максимальний / High-Visibility)</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h4>⚡ Візуальні Ефекти & Продуктивність</h4>
                    <div class="settings-row">
                        <label>Режим продуктивності:</label>
                        <select id="setting-perf-mode" onchange="setPerfMode(this.value)">
                            <option value="auto">Авто (Легкий на телефонах і слабких ПК) — Рекомендовано</option>
                            <option value="lite">Легкий (без частинок, розмиття фону й анімацій)</option>
                            <option value="full">Повний (усі ефекти, частинки з лініями)</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>Прозорість панелей:</label>
                        <select id="setting-glass" onchange="setSettingsGlassIntensity(this.value)">
                            <option value="heavy">Напівпрозора панель (Рекомендовано)</option>
                            <option value="ultra">Прозора панель (Максимальна прозорість)</option>
                            <option value="subtle">Щільна панель</option>
                            <option value="solid">Суцільний непрозорий колір</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>Фонові частинки Canvas:</label>
                        <select id="setting-particles" onchange="toggleParticlesSetting(this.value)">
                            <option value="on">Увімкнено (Живі частинки)</option>
                            <option value="off">Вимкнено (Статичний фон)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-secondary btn-danger" onclick="resetAllSettings()">🔁 Скинути до заводських</button>
                <button class="close-btn" style="margin-top:0;" onclick="closeModal('settings-modal')">Зберегти</button>
            </div>
        </div>
    </div>
