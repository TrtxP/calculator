                <!-- Перемикач режимів калькулятора (Базовий / Інженерний / Програміст) -->
                <div class="calc-mode-bar">
                    <button class="calc-mode-tab active" data-mode="basic" onclick="setKeyboardMode('basic')" title="Базовий режим (5 рядів)">🔢 Базовий</button>
                    <button class="calc-mode-tab" data-mode="scientific" onclick="setKeyboardMode('scientific')" title="Інженерний режим (тригонометрія, степені, логарифми)">📐 Інженерний</button>
                    <button class="calc-mode-tab" data-mode="programmer" onclick="setKeyboardMode('programmer')" title="Програміст (HEX/DEC/BIN, бітові операції)">💻 Програміст</button>
                </div>

                <!-- Клавіатура калькулятора -->
                <div class="buttons">
                    <!-- Ряд 1: Робота з пам'яттю (Basic & Scientific) -->
                    <button class="memory kbd-row-mem" onclick="memoryClear()" title="Очистити активну пам'ять">MC</button>
                    <button class="memory kbd-row-mem" onclick="memoryRecall()" title="Викликати з пам'яті">MR</button>
                    <button class="memory kbd-row-mem" onclick="memoryAdd()" title="Додати до пам'яті">M+</button>
                    <button class="memory kbd-row-mem" onclick="memorySubtract()" title="Відняти від пам'яті">M-</button>

                    <!-- Ряди Інженерного режиму (Scientific only) -->
                    <!-- Ряд S1: 2nd Shift та Тригонометрія (DEG / RAD / GRAD) -->
                    <button class="sci shift-btn kbd-row-sci" id="btn-2nd" onclick="toggleSecondMode()" title="Перемкнути додаткові функції (2nd)">2nd</button>
                    <button class="sci kbd-row-sci" id="btn-sin" onclick="handleTrigOrSecondary('sin')" title="Синус / Арксинус">sin</button>
                    <button class="sci kbd-row-sci" id="btn-cos" onclick="handleTrigOrSecondary('cos')" title="Косинус / Арккосинус">cos</button>
                    <button class="sci kbd-row-sci" id="btn-tan" onclick="handleTrigOrSecondary('tan')" title="Тангенс / Арктангенс">tan</button>

                    <!-- Ряд S2: Гіперболічні / Логарифми / Степені -->
                    <button class="sci kbd-row-sci" id="btn-sinh" onclick="handleHyperbolicOrSecondary('sinh')" title="Гіперболічний синус / косинус">sinh</button>
                    <button class="sci kbd-row-sci" id="btn-ln" onclick="handleLnOrLog2()" title="Натуральний ln / Двійковий log2">ln</button>
                    <button class="sci kbd-row-sci" id="btn-log" onclick="handleLogOr10x()" title="Десятковий log10 / 10^x">log</button>
                    <button class="action kbd-row-sci" id="btn-sqr" onclick="handleSquareOrCube()" title="Квадрат x² / Куб x³">x²</button>

                    <!-- Ряд S3: Корені, Степені та Модуль -->
                    <button class="action kbd-row-sci" id="btn-sqrt" onclick="handleSqrtOrCbrt()" title="Квадратний корінь √ / Кубічний ∛">√</button>
                    <button class="action kbd-row-sci" id="btn-pow" onclick="handlePowerOrExp()" title="Піднесення до степеня xⁿ / eˣ">xⁿ</button>
                    <button class="action kbd-row-sci" onclick="calculateAbs()" title="Модуль числа |x|">|x|</button>
                    <button class="action kbd-row-sci" onclick="calculateInverse()" title="Обернене число 1/x">1/x</button>

                    <!-- Ряд S4: Константи та Дужки -->
                    <button class="action kbd-row-sci" onclick="insertPi()" title="Число Пі (3.14159...)">π</button>
                    <button class="action kbd-row-sci" onclick="insertEuler()" title="Число Ейлера e (2.71828...)">e</button>
                    <button class="action kbd-row-sci" onclick="appendBracket('(')" title="Відкрити дужку">(</button>
                    <button class="action kbd-row-sci" onclick="appendBracket(')')" title="Закрити дужку">)</button>

                    <!-- Ряди Програмістського режиму (Programmer only) -->
                    <!-- Ряд P1: Швидка конвертація систем числення -->
                    <button class="sci kbd-row-prog" onclick="handleProgBaseQuick('HEX')" title="Швидкий перегляд у HEX">HEX</button>
                    <button class="sci kbd-row-prog" onclick="handleProgBaseQuick('DEC')" title="Швидкий перегляд у DEC">DEC</button>
                    <button class="sci kbd-row-prog" onclick="handleProgBaseQuick('OCT')" title="Швидкий перегляд у OCT">OCT</button>
                    <button class="sci kbd-row-prog" onclick="handleProgBaseQuick('BIN')" title="Швидкий перегляд у BIN">BIN</button>

                    <!-- Ряд P2: Побітові операції -->
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('AND')" title="Побітове І (AND)">AND</button>
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('OR')" title="Побітове АБО (OR)">OR</button>
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('XOR')" title="Виключне АБО (XOR)">XOR</button>
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('NOT')" title="Побітове НЕ (~NOT)">NOT</button>

                    <!-- Ряд P3: Зсуви та дужки -->
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('SHL')" title="Побітовий зсув вліво (&lt;&lt;)">&lt;&lt;</button>
                    <button class="action kbd-row-prog" onclick="handleProgBitwiseOp('SHR')" title="Побітовий зсув вправо (&gt;&gt;)">&gt;&gt;</button>
                    <button class="action kbd-row-prog" onclick="appendBracket('(')" title="Відкрити дужку">(</button>
                    <button class="action kbd-row-prog" onclick="appendBracket(')')" title="Закрити дужку">)</button>

                    <!-- Базові арифметичні ряди (Core: активні у всіх режимах) -->
                    <!-- Ряд C1: Керування, Очищення, Modulo та Ділення -->
                    <button class="clear kbd-row-core" onclick="clearDisplay()" title="Очистити все">C</button>
                    <button class="action kbd-row-core" onclick="backspace()" title="Стерти символ" style="display:flex; align-items:center; justify-content:center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                            <line x1="18" y1="9" x2="12" y2="15"></line>
                            <line x1="12" y1="9" x2="18" y2="15"></line>
                        </svg>
                    </button>
                    <button class="action kbd-row-core" onclick="appendOperator('mod')" title="Остача від ділення (mod)">mod</button>
                    <button class="operator kbd-row-core" onclick="appendOperator('/')" title="Ділення">÷</button>
                    
                    <!-- Ряд C2: 7, 8, 9, Множення -->
                    <button class="kbd-row-core" onclick="appendNumber('7')">7</button>
                    <button class="kbd-row-core" onclick="appendNumber('8')">8</button>
                    <button class="kbd-row-core" onclick="appendNumber('9')">9</button>
                    <button class="operator kbd-row-core" onclick="appendOperator('*')" title="Множення">×</button>
                    
                    <!-- Ряд C3: 4, 5, 6, Віднімання -->
                    <button class="kbd-row-core" onclick="appendNumber('4')">4</button>
                    <button class="kbd-row-core" onclick="appendNumber('5')">5</button>
                    <button class="kbd-row-core" onclick="appendNumber('6')">6</button>
                    <button class="operator kbd-row-core" onclick="appendOperator('-')" title="Віднімання">−</button>
                    
                    <!-- Ряд C4: 1, 2, 3, Додавання -->
                    <button class="kbd-row-core" onclick="appendNumber('1')">1</button>
                    <button class="kbd-row-core" onclick="appendNumber('2')">2</button>
                    <button class="kbd-row-core" onclick="appendNumber('3')">3</button>
                    <button class="operator kbd-row-core" onclick="appendOperator('+')" title="Додавання">+</button>
                    
                    <!-- Ряд C5: Знак, 0, Крапка, Дорівнює -->
                    <button class="action kbd-row-core" onclick="toggleSign()" title="Змінити знак (+/-)">+/-</button>
                    <button class="kbd-row-core" onclick="appendNumber('0')">0</button>
                    <button class="kbd-row-core" onclick="appendNumber('.')">.</button>
                    <button class="equals kbd-row-core" onclick="calculate()" title="Обчислити результат">=</button>
                </div>
